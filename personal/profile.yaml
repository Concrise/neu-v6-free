# 面板说明里的个人信息（通用版是中性措辞）
base_notes:
  ① 免流隧道: 决定流量怎么离开校园网（第一跳）。所有带 [免流] 的节点和「隧道直出」都先走这里。默认「Azure 香港 v6 · Reality」：走 TCP，延迟约 50ms，实测可跑约 140Mbps。港机每月出站到 130GB 会自动停代理，这时请手动切到 Netcup 的入口或「自动选择」（在全部入口里挑最快可用的，挂了会自动换）。Hysteria2/TUIC 走 UDP，Reality/AnyTLS 走 TCP。离开校园网时选「不走隧道」，[免流] 节点会自动变成普通直连代理。
  ④ 国内·仅IPv4: 国内网站、但只有 IPv4 时走这里。默认「隧道直出」（免费，对方看到香港机房 IP）；遇到不认海外 IP 的网站，可临时切到「本机直连·仅IPv4」（计费）。
group_notes:
  🤖 AI: ChatGPT、Claude、Gemini、Perplexity 等海外 AI 服务。默认「[v4直连] 美国家宽 Sixtynet · 经搬瓦工中转」（家宽 IP，延迟低，计费）；想省流量可切到 [免流] 版本。
  📺 YouTube: YouTube 视频与 App。流量大，默认「隧道直出」：从免流入口（默认 Azure 香港）直接出去，只经一跳、延迟最低，看视频不需要家宽 IP。注意它会消耗港机每月 130GB 出站额度。
