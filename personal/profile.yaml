# 自用设置（可入库，不含密钥与服务器 IP）。密钥、订阅链接、服务器 IP 在 config.local.yaml。
# 生成：node core/cli.js -c profile.yaml -c config.local.yaml -p mac  （./update.sh 会自动做）
# entry_servers（服务器 IP）放在 config.local.yaml：港机在前（默认入口）、Netcup 在后（也当落地）
default_landing: "🇺🇸 家宽Sixtynet"
hy2_brutal: {up_mbps: 30, down_mbps: 100}
entry_default: vless
exclude_nodes_regex: "Oracle-SJ-ARM(-v6)?$"
entry_group_aliases: ["🆓 免流入口"]
# 订阅（妙妙屋 自用东大版）已用 dialer-proxy 标好哪些节点走免流入口；CF优选节点有意不挂，所以不自动加
landings_via_entry: false
display_names:   # 订阅节点名 → 面板显示名；面板会自动加「（经服务器）」或「（直连 v4）」
  "🇺🇸 家宽Sixtynet": "美国家宽"
  "🇺🇸 搬瓦工→Sixtynet家宽": "美国家宽 经搬瓦工"
  "🇺🇸 DMIT→Sixtynet家宽": "美国家宽 经DMIT"
  "🇺🇸 DMIT-圣何塞": "DMIT 圣何塞机房"
  "🇺🇸搬瓦工-洛杉矶": "搬瓦工 洛杉矶机房"
  "🇩🇪 Netcup-AnyTLS": "德国 Netcup AnyTLS"
  "🇩🇪 Netcup-Reality": "德国 Netcup Reality"
  "🇩🇪 Netcup-VMess-WS": "德国 Netcup VMess"
  "🇩🇪 Netcup-Hysteria2": "德国 Netcup Hy2"
  "🇩🇪 Netcup-TUIC": "德国 Netcup TUIC"
  "Netcup-CF-家庭WiFi-联通-SJC": "Netcup CF优选 联通SJC"
  "Netcup-CF-手机流量-移动-FRA": "Netcup CF优选 移动FRA"
  "Netcup-CF-家庭WiFi-联通-LAX-1": "Netcup CF优选 联通LAX"
group_defaults:
  "🤖 AI": "美国家宽 经搬瓦工（经服务器）"
rules_dir: /usr/local/etc/neu-v6-router/rules
panel_dir: /usr/local/etc/neu-v6-router/panel
cache_file: neu-v6-router.cache.db
panel_pages:
  "🏠 HK家宽": "专供指纹浏览器，每个端口固定一条 HK 家宽、本机 v4 直连（计费）"
  "🔌 本机直连": "专供指纹浏览器：全部流量本机 IPv4 直连（校园网真实 IP，计费），不经服务器、不按站点分流，切换任何分组都不影响它"


# 面板说明里的个人信息（通用版是中性措辞）
base_notes:
  免流服务器: "所有免费流量经哪台服务器出去。默认港机 Reality（延迟约 50ms，实测约 140Mbps）。港机每月出站到 130GB 会自动停，这时手动换成 Netcup 的入口或「自动选最快」。离开校园网时选「不用服务器」。"
group_notes:
  🤖 AI: "ChatGPT、Claude、Gemini 等。默认「美国家宽 经搬瓦工（经服务器）」：港机 → 搬瓦工 → Sixtynet 家宽出口，免费（算港机出站）；想要更低延迟可选「（直连 v4）」版本，计费。"
  📺 YouTube: "YouTube 视频与 App。默认从免流服务器直接出去（一跳、最快）。流量大，会消耗港机每月 130GB 出站额度。"
