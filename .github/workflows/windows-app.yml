# 每次推送都编一份，产物保留 90 天；本地打发布包（node cli.js --package）时按当前提交下载：
#   neu-v6-free-windows-app  Windows 外壳（windows/app：窗口 + 托盘图标），放进 Windows 安装包的 app 目录
#   neu-v6-free-helper       本地助手兼安装程序（helper/，Go）：本机没装 go 时用它
name: Windows App

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    runs-on: macos-latest  # 助手只有 macOS / Windows 两个平台，测试要在其中之一上跑
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 检查配置生成逻辑
        run: node --test lib/build.test.js lib/china-max.test.js
      - name: 检查、编译
        run: |
          v=$(node -p 'require("./package.json").version')
          test -z "$(gofmt -l helper)" || { gofmt -l helper; echo "要 gofmt"; exit 1; }
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64; do GOOS=${t%/*} GOARCH=${t#*/} go vet ./helper; done
          go test ./helper
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$v" -o "out/$3" ./helper; }
          b darwin arm64 neu-v6-free-darwin-arm64
          b darwin amd64 neu-v6-free-darwin-amd64
          b windows amd64 neu-v6-free-windows-amd64.exe
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: neu-v6-free-helper
          path: out
          retention-days: 90
          if-no-files-found: error

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 画图标
        shell: powershell  # Windows PowerShell 5.1，和用户电脑上一样
        run: windows/app/make-icon.ps1 windows/app/app.ico

      - name: 检查 1.1.x 升级用的过渡脚本
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/migrate/helper.ps1), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "语法没问题"

      - name: 编译
        shell: pwsh  # 5.1 按 ANSI 读 Actions 生成的临时脚本，中文会乱
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          dotnet publish windows/app/NeuV6Free.csproj -c Release -o out/app "-p:Version=$v"
          Get-ChildItem out/app -Recurse -File | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path out/app).Path.Length + 1) }
          $pv = (Get-Item out/app/neu-v6-free.exe).VersionInfo.ProductVersion
          if ($pv -ne $v) { throw "exe 的版本是 $pv，应该是 $v" }
          foreach ($a in 'x64', 'arm64', 'x86') {
            if (-not (Test-Path "out/app/runtimes/win-$a/native/WebView2Loader.dll")) { throw "缺少 $a 的 WebView2Loader.dll" }
          }
          # 要是 AnyCPU（64 位系统上以 64 位运行，ARM64 上以 ARM64 运行）：CLR 头只有 ILOnly，没有「要求 / 偏好 32 位」
          $fs = [IO.File]::OpenRead((Resolve-Path out/app/neu-v6-free.exe).Path)
          $pe = [System.Reflection.PortableExecutable.PEReader]::new($fs)
          $flags = [int]$pe.PEHeaders.CorHeader.Flags
          $fs.Dispose()
          if (-not ($flags -band 1) -or ($flags -band 0x20002)) { throw ("exe 不是 AnyCPU：CorFlags = 0x{0:x}" -f $flags) }
          "CorFlags = 0x{0:x}（AnyCPU）" -f $flags

      - uses: actions/upload-artifact@v7
        with:
          name: neu-v6-free-windows-app
          path: out/app
          retention-days: 90
          if-no-files-found: error
