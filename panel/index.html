<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园网 v6 免流面板</title>
<style>
  :root {
    color-scheme: light dark;  /* 滚动条、输入框、下拉框跟着系统深色 / 浅色（只换变量的话它们一直是浅色） */
    --bg: #f4f5f7; --side: #eceef2; --panel: #ffffff; --sunken: #eef0f3; --field: #ffffff; --line: #e1e4e9;
    --text: #14171c; --muted: #5b6270; --faint: #6b7280; --nav-on: #ffffff;
    --accent: #1f5fd1; --on-accent: #ffffff; --accent-soft: #eaf0fd; --accent-line: #c9d8f7;
    --free: #0e7a5a; --free-soft: #e2f4ec; --paid: #9a5b13; --paid-soft: #fbefdd; --mix: #1f5fd1; --mix-soft: #eaf0fd;
    --bad: #b42318; --bad-soft: #fdeceb; --lift: 0 1px 2px rgba(16, 24, 40, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --side: #14171c; --panel: #181b21; --sunken: #1e2229; --field: #13161b; --line: #2a2f38;
      --text: #e8eaee; --muted: #a3a9b5; --faint: #8d94a1; --nav-on: #232832;
      --accent: #7ea6ff; --on-accent: #0b1220; --accent-soft: #1c2740; --accent-line: #2c3d63;
      --free: #5cd3a2; --free-soft: #12291f; --paid: #f0b35e; --paid-soft: #2e2312; --mix: #7ea6ff; --mix-soft: #1c2740;
      --bad: #f58a8a; --bad-soft: #3a1d1d; --lift: 0 1px 2px rgba(0, 0, 0, .4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 布局：左边菜单，右边内容 */
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  .app.bare { grid-template-columns: 1fr; }
  .app.bare nav { display: none; }
  nav { background: var(--side); border-right: 1px solid var(--line); padding: 22px 12px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
        display: flex; flex-direction: column; gap: 3px; }
  nav .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; font-weight: 650; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--text); color: var(--bg); display: grid; place-items: center;
          font-weight: 700; font-size: 13px; letter-spacing: -.3px; flex: none; }
  nav a { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 10px; color: var(--muted); font-weight: 550; }
  nav a:hover { color: var(--text); background: var(--nav-on); text-decoration: none; }
  nav a.on { background: var(--nav-on); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  nav a .n { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--accent); }
  nav .space { flex-grow: 1; min-height: 16px; }
  nav .ver { padding: 6px 12px 0; font-size: 12px; color: var(--faint); }
  main { min-width: 0; padding: 32px 24px 64px; }
  .wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .wrap.narrow { max-width: 760px; }
  h1 { font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -.3px; margin: 0; }
  h2 { font-size: 17px; font-weight: 650; margin: 0; }
  .lead { color: var(--muted); margin: 4px 0 0; max-width: 820px; }
  .back { font-size: 14px; margin-bottom: 6px; display: inline-block; }
  .sec { display: flex; flex-direction: column; gap: 12px; }
  .sec-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .sec-head > div { flex: 1 1 280px; }
  .sec-head p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

  /* 基本部件 */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .card.big { border-radius: 16px; padding: 22px 24px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .li { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 13px 20px; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .li .main { flex: 1 1 220px; min-width: 0; }
  .li .t { font-weight: 600; }
  .li .d { font-size: 13px; color: var(--muted); }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  a.li { color: var(--text); min-height: 64px; }
  a.li:hover { text-decoration: none; background: var(--sunken); }
  .list > a.li:first-child { border-radius: 14px 14px 0 0; }
  .list > a.li:last-child { border-radius: 0 0 14px 14px; }
  .badge { display: inline-block; font-size: 12px; line-height: 18px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 650; }
  .b-free { background: var(--free-soft); color: var(--free); }
  .b-paid { background: var(--paid-soft); color: var(--paid); }
  .b-mix { background: var(--mix-soft); color: var(--mix); }
  .b-muted { background: var(--sunken); color: var(--muted); font-weight: 550; }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 10px;
         border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font: inherit; font-size: 14px; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-line); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
  .btn.big { min-height: 44px; padding: 0 22px; font-size: 15px; }
  .btn.small { min-height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; }
  .btn:disabled { opacity: .55; cursor: default; }
  select, input[type=text], input[type=password], input[type=search], input[type=url], textarea {
    border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 10px; padding: 0 12px; min-height: 40px; font: inherit; max-width: 100%; }
  textarea { padding: 10px 12px; }
  input.big { min-height: 44px; padding: 0 14px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-line); border-color: var(--accent); }
  input[type=checkbox], input[type=radio] { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
  label.check { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; font-size: 14px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 550; font-size: 13px; }
  td .muted, .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .note { background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 13px 18px; border-radius: 12px; }
  .note.warn { background: var(--paid-soft); border-color: transparent; }
  .note.err { background: var(--bad-soft); border-color: transparent; }
  .note.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .note.bar > span { flex: 1 1 300px; }
  .hint { font-size: 13px; color: var(--muted); }
  .hint.err, .err-msg { color: var(--bad); }

  /* 选项：一组按钮选一个（线路、运行方式、去向） */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 7px 14px; border-radius: 10px; border: 2px solid var(--line);
          background: var(--panel); color: var(--text); font: inherit; cursor: pointer; text-align: left; max-width: 100%; }
  .chip:hover { border-color: var(--accent-line); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); }
  .chip .tt { display: flex; flex-direction: column; min-width: 0; }
  .chip .tt b { font-weight: 600; overflow-wrap: anywhere; }
  .chip .tt span { font-size: 12px; color: var(--muted); }
  .pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .pick .chip { flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px 18px; border-radius: 14px; min-height: 92px; }
  .pick .chip b { font-size: 16px; font-weight: 650; }
  .pick .chip span { font-size: 14px; color: var(--muted); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunken); flex-wrap: wrap; }
  .seg button { min-height: 34px; padding: 0 13px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--panel); color: var(--text); font-weight: 650; box-shadow: var(--lift); }

  /* 概览 */
  .hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .hero .ring { width: 52px; height: 52px; border-radius: 999px; display: grid; place-items: center; background: var(--free-soft); flex: none; }
  .hero .ring i { width: 18px; height: 18px; border-radius: 999px; background: var(--free); }
  .hero.warn .ring { background: var(--paid-soft); }
  .hero.warn .ring i { background: var(--paid); }
  .hero .txt { flex: 1 1 280px; }
  .hero h1 { font-size: 28px; line-height: 1.25; }
  .hero .txt div { color: var(--muted); }
  .hero-mode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .hero-note { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .stat { display: flex; flex-direction: column; gap: 6px; }
  .stat .k { font-size: 13px; color: var(--muted); display: flex; gap: 8px; }
  .stat .k span { flex-grow: 1; }
  .stat .v { font-size: 34px; font-weight: 700; line-height: 1.15; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 18px; font-weight: 600; }
  .stat .s { font-size: 13px; color: var(--muted); }
  .stat .v.free { color: var(--free); }
  .stat .v.paid { color: var(--paid); }
  .stat .v.srv { color: var(--accent); }
  a.stat { color: var(--text); }
  a.stat:hover { text-decoration: none; border-color: var(--accent); box-shadow: var(--lift); }
  a.stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .stat .more { color: var(--accent); white-space: nowrap; }
  .site-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); }
  .site-row:first-child { border-top: 0; }
  .site-name { overflow-wrap: anywhere; font-weight: 550; }
  .site-track { height: 5px; background: var(--sunken); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .site-track i { display: block; height: 100%; border-radius: inherit; background: var(--site-color); }
  .site-size { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .site-size small { display: block; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; justify-content: space-around; gap: 12px; height: 64px; }
  .bars div { flex: 1 1 0; max-width: 72px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 64px; }
  .bars i { display: block; border-radius: 3px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; }
  .via { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
  .via b { font-weight: 600; overflow-wrap: anywhere; }
  .via .arrow { color: var(--faint); }
  .tip { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 20px; border-radius: 14px; border: 1px dashed var(--line); }
  .tip > div { flex: 1 1 320px; }

  /* 新手引导 */
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .steps div { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
  .steps i { height: 4px; border-radius: 2px; background: var(--line); }
  .steps .done i { background: var(--accent); }
  .steps .cur { color: var(--text); font-weight: 650; }
  .lane { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lane b { width: 128px; font-weight: 600; }
  .lane i { flex: 1 1 160px; height: 8px; border-radius: 4px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .facts div { display: flex; flex-direction: column; gap: 4px; }
  .facts b { font-weight: 600; }
  .facts span { font-size: 13px; color: var(--muted); }
  .facts.boxed div { border-radius: 12px; padding: 14px; background: var(--sunken); }
  .checks .li { padding: 10px 16px; border-top: 0; }
  .dot { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 2px solid var(--line); flex: none; }
  .dot.ok { background: var(--free); border-color: var(--free); color: var(--panel); }
  .dot.run { border-color: var(--accent); color: var(--accent); }
  .dot.bad { background: var(--bad); border-color: var(--bad); color: var(--panel); }

  /* 订阅 */
  .usage { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
  .usage i { display: block; height: 8px; border-radius: 4px; background: var(--accent); }
  .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .node { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--sunken); font-size: 14px; }
  .node span:first-child { flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 分组详情里的选项 */
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .opt { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; display: grid; gap: 4px; }
  .opt:hover { border-color: var(--accent-line); }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt .t { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; word-break: break-all; }
  .opt .d { color: var(--muted); font-size: 13px; }
  .delay { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .d-ok { color: var(--free); } .d-mid { color: var(--paid); } .d-bad { color: var(--bad); }

  /* 弹窗、提示、登录 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: grid; place-items: center; z-index: 10; padding: 16px; }
  .modal { background: var(--panel); border-radius: 16px; border: 1px solid var(--line); padding: 22px 24px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal label.choice { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .modal label.choice input { margin-top: 4px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal input[type=text], .modal select, .modal textarea { width: 100%; }
  .field { margin: 12px 0; }
  .field > .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px;
           border-radius: 10px; z-index: 20; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); max-width: 90vw; }
  .login { max-width: 440px; margin: 14vh auto; display: flex; flex-direction: column; gap: 14px; }
  .login input { width: 100%; }
  details summary { cursor: pointer; }
  ol.prio { padding-left: 20px; } ol.prio li { margin: 6px 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    nav .brand { width: 100%; padding-bottom: 8px; }
    nav .space, nav .ver { display: none; }
    main { padding: 20px 16px 48px; }
    table { display: block; overflow-x: auto; }
    .lane b { width: 100%; }
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .glossary .card b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// 面板直接调 sing-box 的 Clash API（切换分组、测延迟、实时连接）；「我的规则」和流量统计走本地助手（neu-v6-free run）。
const API = location.origin;
const DELAY_URL = "https://www.gstatic.com/generate_204";
const ENTRY_OFF = "不用服务器（离校时选）";
let secret = "";
try { secret = localStorage.getItem("neu-secret") || ""; } catch { }
// 第一次安装后脚本打开的网址带着密钥（#secret=…，# 后面不会发给服务器）：存下来、从地址栏去掉，就算登录了
const fromInstall = location.hash.match(/^#secret=([^&]+)/);
if (fromInstall) {
  secret = decodeURIComponent(fromInstall[1]);
  try { localStorage.setItem("neu-secret", secret); } catch { }
  history.replaceState(null, "", location.pathname + location.search + "#/home");
}
let meta = null, proxies = {}, version = "", delays = {};
let helper = { ok: false, rules: false, traffic: false, error: "" }, userRules = null;
let timer = null;

const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const main = () => document.querySelector("main .wrap");

function toast(msg) {
  const t = $(`<div class="toast">${esc(msg)}</div>`);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { Authorization: "Bearer " + secret, "Content-Type": "application/json" } });
  if (r.status === 401) { try { localStorage.removeItem("neu-secret"); } catch { } secret = ""; renderLogin("密钥不对，请重新输入"); throw new Error("401"); }
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

const helperBase = () => `http://${location.hostname}:${meta.traffic_port || 9091}`;
async function helperApi(path, opt = {}) {
  const r = await fetch(helperBase() + path, { cache: "no-store", ...opt, headers: { Authorization: "Bearer " + secret, "Content-Type": "application/json" } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
}

async function checkHelper() {
  try { helper = { ...(await helperApi("/health")), error: "" }; }
  catch (e) {
    // 旧版只有流量统计、没有 /health
    try { await helperApi("/traffic"); helper = { ok: true, rules: false, traffic: true, error: "old" }; }
    catch { helper = { ok: false, rules: false, traffic: false, error: e.message }; }
  }
}

// ---------- 出口说明：免费还是计费 ----------
function leaf(name, depth = 0) {
  const p = proxies[name];
  if (!p || depth > 8) return name;
  if (["Selector", "URLTest", "Fallback"].includes(p.type) && p.now) return leaf(p.now, depth + 1);
  return name;
}
function cost(name) {
  if (name === "拒绝") return ["b-bad", "断开"];
  const l = leaf(name), t = proxies[l]?.type;
  if (t === "Direct") {
    if (l === "直连 v4") return ["b-paid", "计费"];
    if (l === "直连 v6") return ["b-free", "免费"];
    if (l === ENTRY_OFF) return ["b-mix", "全部直连"];
    return ["b-mix", "v6 免费 · v4 计费"];
  }
  if (l.endsWith(meta.v4_suffix)) return ["b-paid", "计费"];
  if (meta.mode === "tunnel") return ["b-free", "免费"];
  return ["b-mix", "节点有 v6 才免费"];
}
const costBadge = (name) => { const [c, t] = cost(name); return `<span class="badge ${c}">${t}</span>`; };

function optNote(name) {
  if (meta.notes[name]) return meta.notes[name];
  if (meta.node_notes[name]) return meta.node_notes[name];
  const p = proxies[name];
  if (p?.type === "URLTest") return "自动测速，当前用：" + (p.now || "测速中");
  if (p?.type === "Selector") return `跟随「${name}」的选择，当前：${p.now}`;
  return "";
}

function delayHtml(name) {
  const d = delays[name];
  if (d === undefined) return "";
  if (d === "…") return `<span class="delay muted">测试中</span>`;
  if (!d) return `<span class="delay d-bad">超时</span>`;
  return `<span class="delay ${d < 300 ? "d-ok" : d < 700 ? "d-mid" : "d-bad"}">${d} ms</span>`;
}

async function load() { proxies = (await api("/proxies")).proxies; }

async function choose(group, name) {
  try { await api("/proxies/" + encodeURIComponent(group), { method: "PUT", body: JSON.stringify({ name }) }); }
  catch (e) { if (e.message !== "401") toast("切换失败：" + e.message); return; }
  await load();
  toast(`「${group}」改为：${name}`);
  render();
}

function groupSelect(name, cls = "") {
  const p = proxies[name];
  const sel = $(`<select class="${cls}">${p.all.map((n) => `<option value="${esc(n)}" ${n === p.now ? "selected" : ""}>${esc(dn(n))}</option>`).join("")}</select>`);
  sel.onchange = () => choose(name, sel.value);
  return sel;
}

const PAGES = [["home", "概览"], ["routes", "线路与规则"], ["subs", "订阅与节点"], ["settings", "设置"]];
const SUBPAGES = { sites: "home", group: "routes", conn: "settings", traffic: "settings", ports: "settings", logs: "settings", help: "settings", welcome: "" };
const OLD_PAGES = { groups: "routes", rules: "routes" };  // 以前的地址

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  let [page, ...rest] = h.split("/");
  page = OLD_PAGES[page] || page;
  const known = PAGES.some((p) => p[0] === page) || page in SUBPAGES;
  return { page: known ? page : "home", arg: rest.join("/") };
}

/** 分组、出口名字前面的 emoji 只在显示时去掉（Clash API 里还是原名） */
const dn = (name) => String(name ?? "").replace(/^[^\p{Script=Han}\p{Script=Latin}\p{N}（(]+/u, "") || String(name ?? "");

/** 页面标题；从别的页面进来的带一个返回 */
function head(title, lead, back) {
  return $(`<div>${back ? `<a class="back" href="#/${back[0]}">← ${back[1]}</a>` : ""}<h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div>`);
}

function renderNav() {
  const { page } = route();
  const cur = page in SUBPAGES ? SUBPAGES[page] : page;
  const nav = document.querySelector("nav");
  nav.innerHTML = `<div class="brand"><span class="logo">v6</span>校园网 v6 免流</div>`;
  for (const [key, label] of PAGES) {
    let n = "";
    if (key === "settings" && helper.update?.available) n = "有更新";
    nav.append($(`<a href="#/${key}" class="${cur === key ? "on" : ""}"${cur === key ? ' aria-current="page"' : ""}>${icon(key)}${label}<span class="n">${n}</span></a>`));
  }
  nav.append($(`<div class="space"></div>`), $(`<a href="#/welcome" class="${page === "welcome" ? "on" : ""}">${icon("help")}新手引导</a>`),
    $(`<div class="ver">${esc([helper.version && "版本 " + helper.version, version].filter(Boolean).join(" · "))}</div>`));
}

function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function render() {
  stopTimer();
  if (logWs) { logWs.close(); logWs = null; }
  const { page, arg } = route();
  document.querySelector(".app").classList.toggle("bare", page === "welcome");
  renderNav();
  const m = main();
  m.innerHTML = "";
  m.classList.toggle("narrow", page === "welcome");
  if (prof()?.pending && page !== "welcome") m.append(pendingBar());
  ({ home: renderHome, sites: () => renderSites(arg), routes: renderRoutes, group: () => renderGroup(arg), conn: renderConn, traffic: renderTraffic, ports: renderPorts,

}

          if (sub) {

            if (!/^https?:\/\//i.test(s.url)) throw new Error("请填 http:// 或 https:// 开头的订阅链接");
            await fetchSub(s);
            w.found = { sub: s, title: `读到 ${s.proxies.length} 个节点（${s.name}）`, more: "国外网站默认「自动选最快」，以后可以在「线路与规则」里改。" };
          } else {
            const r = (await lib()).parseSubscription(w.text);
            const srv = r.settings?.entry_servers;
            if (!srv) throw new Error(r.proxies.length ? "认出了节点，但没有服务器的 IPv6 地址：请粘贴 setup.sh 最后输出的那一整段" : (r.errors[0] || "没有认出内容"));
            w.found = { nodes: r.proxies, settings: r.settings, title: `认出 ${Object.keys(srv).length} 台服务器：${Object.values(srv).map((x) => x.label).join("、")}`,
              more: `${r.proxies.length} 种连接方式。电脑用 IPv6 连过去，服务器再用 IPv4 访问网站。` };
          }
        } catch (e) { w.err = e.message; }
        redraw();
      };
      body.append($(`<label for="wz-in" style="font-weight:600;font-size:14px;margin-bottom:-10px">${sub ? "订阅链接" : "脚本输出"}</label>`));
      if (sub) { const r = $(`<div class="row"></div>`); r.append(input, read); body.append(r); }
      else { body.append(input); const r = $(`<div class="row"></div>`); r.append(read); body.append(r); }
      if (w.found) body.append($(`<div class="note" style="background:var(--free-soft);border-color:transparent"><b style="color:var(--free)">${esc(w.found.title)}</b><div class="hint">${esc(w.found.more)}</div></div>`));
      if (w.err) body.append($(`<div class="note err">${esc(w.err)}</div>`));
    }
  }

  if (w.step === 4) {
    const r = w.result;
    if (w.choice === "none") title("好了，可以用了", "以后打开这个窗口，看到的就是概览页。");
    else {
      title(r?.ok ? "好了，可以用了" : r ? "没有应用成功" : "正在应用",
        r?.ok ? "以后打开这个窗口，看到的就是概览页。" : r ? "原来的配置没动，网络不受影响。" : "新配置上不了网会自动换回原来的，不用担心把网弄断。");
      const items = [["保存设置", "已保存"], ["生成配置、重启 sing-box", "网络断开了几秒"], ["检查能不能上网", r?.fallback ? "连不上服务器，暂时改走直连" : "经 sing-box 正常"]];
      const list = $(`<div class="list checks" style="padding:6px 0"></div>`);
      items.forEach(([name, ok], i) => {
        const done = r?.ok || i < w.phase, run = !r && (i === w.phase || (w.phase === 1 && i === 2)), bad = r && !r.ok && i === w.phase;
        list.append($(`<div class="li"><span class="dot ${done ? "ok" : run ? "run" : bad ? "bad" : ""}">${done ? "✓" : bad ? "!" : run ? "…" : ""}</span>
          <span class="grow">${name}</span><span class="hint">${done ? ok : bad ? "没通过" : run ? "进行中…" : "等待"}</span></div>`));
      });
      body.append(list);
      if (r && !r.ok) body.append($(`<div class="note err">${esc(r.err)}</div>`));
      if (r?.warnings?.length) body.append($(`<div class="note warn small">生成时的提示：${esc(r.warnings.join("；"))}</div>`));
    }
    if (w.choice === "none" || r?.ok) tips();
  }

  const busy = w.step === 4 && w.choice !== "none" && !w.result;
  if (w.step > 1 && !busy && !(w.step === 4 && (w.choice === "none" || w.result?.ok))) foot.append(button("上一步", "ghost", () => go(w.step - 1)));
  foot.append($(`<span class="grow hint">${w.step < 3 ? `第 ${w.step} 步，共 4 步` : w.step === 3 && w.choice !== "none" ? "应用时网络会断开几秒" : ""}</span>`));
  if (w.step < 3) foot.append(button("下一步", "primary", () => go(w.step + 1)));
  if (w.step === 3) {
    const b = button(w.choice === "none" ? "完成" : "应用", "primary", () => { go(4); if (w.choice !== "none") wizApply(redraw); });
    if (w.choice !== "none" && !w.found) b.disabled = true;
    foot.append(b);
  }
  if (w.step === 4 && (w.choice === "none" || w.result?.ok)) foot.append(button("进入面板", "primary", enter));
  if (w.step === 4 && w.result && !w.result.ok) foot.append(button("再试一次", "primary", () => wizApply(redraw)));
}

/** 引导最后一步：把订阅或服务器加进面板的设置，生成配置交给本地助手安装（不通自动换回） */
async function wizApply(redraw) {
  const w = wiz;
  w.phase = 0; w.result = null; redraw();
  try {
    if (!client.profile) client.profile = { version: 1, settings: {}, subscriptions: [], nodes: [] };
    const p = prof();
    if (w.choice === "sub") {
      if (!p.subscriptions.some((x) => x.url === w.found.sub.url)) p.subscriptions.push(w.found.sub);
    } else {
      const names = new Set(p.nodes.map((x) => x.name));
      p.nodes.push(...w.found.nodes.filter((x) => !names.has(x.name)));
      p.settings.entry_servers = { ...(p.settings.entry_servers || {}), ...w.found.settings.entry_servers };
      if (w.found.settings.entry_default) p.settings.entry_default = w.found.settings.entry_default;
    }
    p.pending = true;
    await saveProfile();
    w.phase = 1; redraw();
    const r = await applyClient();
    w.phase = 3;
    w.result = { ok: true, warnings: r.warnings, fallback: r.server_fallback };
    markWelcomed();
  } catch (e) { w.result = { ok: false, err: e.message }; }
  redraw();
}

// ---------- 线路与规则 ----------
// 一页管所有「走哪里」：最上面按网址加规则，然后是主要线路、按应用的例外分组、已有的规则
const BASE_TITLES = { "国外网站": "国外网站", "国内仅 v4 网站": "只有 IPv4 的国内网站", "免流服务器": "免流服务器" };
const BASE_ORDER = ["国外网站", "国内仅 v4 网站", "免流服务器"];
let routesAll = false;

function renderRoutes() {
  const m = main();
  m.append(head("线路与规则", "决定每类网站从哪儿出去。改了立即生效、自动保存，不用点「应用」。"));
  m.append(addRuleCard());

  const rank = (g) => (BASE_ORDER.includes(g.name) ? BASE_ORDER.indexOf(g.name) : 9);
  const base = meta.groups.filter((g) => g.kind === "base" && proxies[g.name]).sort((a, b) => rank(a) - rank(b));
  if (base.length) {
    const sec = $(`<section class="sec" aria-labelledby="base-h"><div class="sec-head"><div><h2 id="base-h">主要线路</h2>

  }

  const svc = meta.groups.filter((g) => g.kind === "service" && proxies[g.name]);
  if (svc.length) {
    const changedFromDefault = (g) => g.default && g.default !== proxies[g.name].now;
    const shown = routesAll ? svc : svc.filter((g, i) => i < 8 || changedFromDefault(g));
    const sec = $(`<section class="sec" aria-labelledby="app-h"><div class="sec-head"><div><h2 id="app-h">按应用单独设置</h2>
      <p>比如 AI 固定用美国节点、Steam 下载走直连。一般不用动。</p></div></div><div class="list"></div></section>`);
    if (svc.length > 8) {
      const t = $(`<button class="btn">${routesAll ? "收起" : `显示全部 ${svc.length} 个`}</button>`);
      t.onclick = () => { routesAll = !routesAll; render(); };
      sec.querySelector(".sec-head").append(t);
    }
    const list = sec.querySelector(".list");
    for (const g of shown) {
      const li = $(`<div class="li"><div class="main"><a class="t" href="#/group/${encodeURIComponent(g.name)}" style="color:var(--text)">${esc(dn(g.name))}</a>
        <div class="d clamp" title="${esc(g.desc)}">${esc(g.desc)}</div></div><div class="row sel" style="flex:0 1 320px;flex-wrap:nowrap"></div></div>`);
      const sel = groupSelect(g.name, "grow");
      sel.setAttribute("aria-label", `${dn(g.name)} 走哪里`);
      sel.style.minWidth = "0";
      li.querySelector(".sel").append(sel, $(costBadge(g.name)));
      if (changedFromDefault(g)) {
        const b = $(`<button class="btn link small">恢复默认</button>`);
        b.onclick = () => choose(g.name, g.default);
        const st = $(`<div class="d">已改，默认是「${esc(dn(g.default))}」 </div>`);
        st.append(b);
        li.querySelector(".main").append(st);
      }
      list.append(li);
    }
    m.append(sec);
  }
  m.append(rulesSection());
}

/** 主要线路的一张卡片：选项少就一排按钮，多（比如几十个节点）就用下拉框 */
function lineCard(g) {
  const p = proxies[g.name];

    <div style="font-weight:650">${esc(BASE_TITLES[g.name] || dn(g.name))}</div><div class="hint">${esc(g.desc)}</div></div>
    <a class="small" href="#/group/${encodeURIComponent(g.name)}">详情与测速</a></div></div>`);
  if (p.all.length <= 6) {
    const chips = $(`<div class="chips" role="radiogroup" aria-label="${esc(dn(g.name))}"></div>`);
    for (const n of p.all) {
      const on = n === p.now, t = proxies[n]?.type;
      const tag = t === "URLTest" ? "自动测速选最快" : t === "Selector" ? `跟随「${dn(n)}」` : n === g.default ? "默认" : "";
      const b = $(`<button type="button" role="radio" aria-checked="${on}" class="chip ${on ? "on" : ""}" title="${esc(optNote(n))}">
        <span class="tt"><b>${esc(dn(n))}</b>${tag ? `<span>${esc(tag)}</span>` : ""}</span>${costBadge(n)}</button>`);
      b.onclick = () => { if (!on) choose(g.name, n); };
      chips.append(b);
    }
    card.append(chips);
  } else {
    const r = $(`<div class="row" style="flex-wrap:nowrap"><span class="small muted" style="white-space:nowrap">现在走</span></div>`);
    const sel = groupSelect(g.name, "grow");
    sel.setAttribute("aria-label", dn(g.name));
    sel.style.minWidth = "0";
    r.append(sel, $(costBadge(g.name)));
    card.append(r);

  if (g.default && g.default !== p.now) {
    const st = $(`<div class="hint">已改，默认是「${esc(dn(g.default))}」 <button class="btn link small">恢复默认</button></div>`);
    st.querySelector("button").onclick = () => choose(g.name, g.default);
    card.append(st);
  }
  return card;
}

function renderGroup(name) {
  const m = main();
  const g = meta.groups.find((x) => x.name === name);
  const p = proxies[name];
  if (!g || !p) { m.append($(`<div class="note err">没有这个分组：${esc(name)}（配置和面板版本不一致？）</div>`)); return; }
  const bar = $(`<div class="row"><span>现在走：<b>${esc(dn(p.now))}</b></span>${costBadge(name)}<span class="grow"></span></div>`);
  const test = $(`<button class="btn">测延迟</button>`);
  test.onclick = () => testAll(p.all, () => renderGroup(name));
  bar.append(test);
  if (g.default && g.default !== p.now) {
    const reset = $(`<button class="btn">恢复默认（${esc(dn(g.default))}）</button>`);
    reset.onclick = () => choose(name, g.default);
    bar.append(reset);
  }
  m.innerHTML = "";
  if (prof()?.pending) m.append(pendingBar());
  m.append(head(esc(BASE_TITLES[name] || dn(name)), esc(g.desc), ["routes", "线路与规则"]), bar);
  // 分区：跟随开关 / 直连 / 免费的（服务器入口、经服务器的落地）/ 计费的落地
  const kinds = { follow: [], direct: [], free: [], v4: [] };
  for (const n of p.all) {
    const t = proxies[n]?.type;
    if (t === "Selector" || t === "URLTest") kinds.follow.push(n);
    else if (t === "Direct") kinds.direct.push(n);
    else if (n.endsWith(meta.v4_suffix)) kinds.v4.push(n);
    else kinds.free.push(n);
  }
  const titles = { follow: "跟随其他开关", direct: "直连（校园网直接出去）",
    free: meta.mode === "tunnel" ? "经服务器（免费）" : "节点", v4: "校园网 IPv4 直接连落地（计费，延迟低）" };
  if (name === meta.entry) { titles.free = "服务器入口（校园网 IPv6 连过去，免费）"; titles.follow = "自动"; }
  for (const k of ["follow", "direct", "free", "v4"]) {
    if (!kinds[k].length) continue;
    const sec = $(`<section class="sec"><h2>${titles[k]}</h2><div class="opts"></div></section>`);
    const grid = sec.querySelector(".opts");
    for (const n of kinds[k]) {
      const card = $(`<button type="button" class="opt ${n === p.now ? "on" : ""}" aria-pressed="${n === p.now}" style="font:inherit;color:inherit;text-align:left">
        <span class="t"><span>${esc(dn(n))}</span>${delayHtml(n)}</span><span class="d">${esc(optNote(n))}</span>
        <span class="row small">${costBadge(n)}${n === g.default ? `<span class="badge b-muted">默认</span>` : ""}</span></button>`);
      card.onclick = () => choose(name, n);
      grid.append(card);
    }
    m.append(sec);
  }
}

async function testAll(list, redraw) {
  list.forEach((n) => (delays[n] = "…"));
  redraw();
  await Promise.all(list.map(async (n) => {
    try { delays[n] = (await api(`/proxies/${encodeURIComponent(n)}/delay?timeout=6000&url=${encodeURIComponent(DELAY_URL)}`)).delay || 0; }
    catch { delays[n] = 0; }
    if (["group", "subs"].includes(route().page)) redraw();
  }));
}

// ---------- 我的规则（在「线路与规则」页里） ----------
const TYPE_NAMES = { domain_suffix: "域名（含子域名）", domain: "只这一个域名", domain_keyword: "域名里包含", ip_cidr: "IP / 网段", process_name: "程序（进程名）" };
const KIND_NAMES = { direct: "直连", server: "服务器", switch: "跟随主要线路", group: "跟随按应用的设置", reject: "拦截" };

function detectType(v) {
  v = v.trim();
  if (/^\d{1,3}(\.\d{1,3}){3}(\/\d{1,2})?$/.test(v) || (/^[0-9a-f:]+(\/\d{1,3})?$/i.test(v) && v.includes(":") && !v.includes("://"))) return "ip_cidr";
  if (/\.exe$/i.test(v) || (!v.includes(".") && !v.includes(":") && !v.includes("/"))) return "process_name";
  return "domain_suffix";
}
function cleanValue(type, v) {
  v = v.trim();
  if (type === "ip_cidr" || type === "process_name") return v;
  v = v.toLowerCase().replace(/^[a-z][a-z0-9+.-]*:\/\//, "").split(/[/?#]/)[0].replace(/:\d+$/, "").replace(/^[*.]+/, "").replace(/\.$/, "");
  // 粘贴的网址多半带 www.：按「含子域名」匹配时去掉，整个网站（api.、m.……）一起管
  return type === "domain_suffix" ? v.replace(/^www\.(?=[^.]+\.[^.]+)/, "") : v;
}
const targetName = (id) => dn((userRules?.targets || meta.user_targets).find((t) => t.id === id)?.name || id);

function targetSelect(value) {
  const ts = meta.user_targets || [];
  const groups = {};
  for (const t of ts) (groups[t.kind] ||= []).push(t);
  const sel = $(`<select>${Object.entries(groups).map(([k, list]) => `<optgroup label="${KIND_NAMES[k] || k}">${list.map((t) =>
    `<option value="${esc(t.id)}" ${t.id === value ? "selected" : ""}>${esc(dn(t.name))}</option>`).join("")}</optgroup>`).join("")}</select>`);
  return sel;
}
const targetDesc = (id) => (meta.user_targets || []).find((t) => t.id === id)?.desc || "";

function helperHelp() {
  if (meta.platform === "windows") return "重新运行一次安装程序（setup.exe，订阅和设置会保留）；本地助手是 Windows 服务「校园网 v6 免流」，日志在 C:\\neu-v6-free\\helper.log。";
  if (meta.platform === "mac") return "重新运行一次安装程序（.pkg，订阅和设置会保留），或运行 sudo launchctl kickstart -k system/local.neu-v6-free；日志在 /usr/local/var/neu-v6-free/helper.log。";
  return "这个平台没有本地助手：在配置文件里写 custom_rules，重新生成后导入。";
}

async function loadRules() {
  if (!helper.rules) { userRules = null; return; }
  try { userRules = await helperApi("/rules"); } catch (e) { userRules = null; helper.error = e.message; }
}

async function saveRule(rule) {
  userRules = await helperApi("/rules", { method: "POST", body: JSON.stringify(rule) });
  renderNav();
  return userRules;
}

// 按网址加一条规则：常用的几个去向做成按钮，其余的在下拉框里
const QUICK_TARGETS = [["direct", "直连"], ["server", "经服务器"], ["abroad", "走国外线路"], ["reject", "拦截"]];
let ruleTarget = "direct", ruleDraft = "";

function addRuleCard() {
  const card = $(`<section class="card big sec" aria-labelledby="add-h"><h2 id="add-h">这个网站走哪里？</h2></section>`);
  if (!meta.user_targets?.length) {
    card.append($(`<p class="hint" style="margin:0">这份配置没有开「我的规则」${meta.platform === "android" || meta.platform === "ios" ? "（手机上不支持）" : "（生成时设了 user_rules: false）"}。
      想加规则可以在配置文件里写 <span class="mono">custom_rules</span>，重新生成后导入。</p>`));
    return card;
  }
  if (!helper.rules) {
    card.append($(`<div class="note err"><b>连不上本地助手（127.0.0.1:${meta.traffic_port || 9091}）</b>，现在不能加规则。${esc(helperHelp())}
      ${helper.error === "old" ? "（现在运行的是旧版助手，只有流量统计。）" : ""}</div>`));
    return card;
  }
  const ts = meta.user_targets;
  if (!ts.some((t) => t.id === ruleTarget)) ruleTarget = "direct";
  const val = $(`<input type="text" class="big" style="width:100%" aria-label="网址、域名、IP 或程序名" placeholder="粘贴网址，例如 https://www.bilibili.com/video/…；也可以填 IP 或程序名（chrome.exe）">`);
  val.value = ruleDraft;
  const chips = $(`<div class="chips" role="radiogroup" aria-label="去向"></div>`);
  for (const [id, label] of QUICK_TARGETS) {
    const t = ts.find((x) => x.id === id);
    if (!t) continue;
    const on = ruleTarget === id;
    const b = $(`<button type="button" role="radio" aria-checked="${on}" class="chip ${on ? "on" : ""}" title="${esc(t.desc)}"><span class="tt"><b>${label}</b></span>
      ${proxies[t.name] || t.kind === "reject" ? costBadge(t.name) : ""}</button>`);
    b.onclick = () => { ruleTarget = id; ruleDraft = val.value; render(); };
    chips.append(b);
  }
  const more = targetSelect(ruleTarget);
  more.prepend(new Option("其他去向……", ""));
  if (QUICK_TARGETS.some(([id]) => id === ruleTarget)) more.value = "";
  more.setAttribute("aria-label", "其他去向");
  more.onchange = () => { if (more.value) { ruleTarget = more.value; ruleDraft = val.value; render(); } };
  chips.append(more);
  const type = $(`<select aria-label="匹配方式"><option value="auto">自动识别</option>${Object.entries(TYPE_NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>`);
  const note = $(`<input type="text" class="grow" placeholder="备注（可不填），例如：学校选课网站" aria-label="备注">`);
  const add = $(`<button class="btn primary big">添加规则</button>`);
  const hint = $(`<div class="hint"></div>`);
  const opts = $(`<div class="row"></div>`);
  opts.append(type, note, add);
  card.append(val, chips, hint, opts, $(`<div class="hint">不知道网址？<a href="#/conn">从正在连接的网站里找</a>，点「改规则」。</div>`));
  const current = () => { const t = type.value === "auto" ? detectType(val.value) : type.value; return { type: t, value: cleanValue(t, val.value) }; };
  const preview = () => {
    hint.classList.remove("err");
    if (!val.value.trim()) { hint.textContent = `${targetName(ruleTarget)}：${targetDesc(ruleTarget)}`; return; }
    const c = current();
    const what = { domain_suffix: `${c.value} 和它的所有子域名`, domain: `只有 ${c.value} 这一个域名`, domain_keyword: `域名里含有「${c.value}」的`,
      ip_cidr: `IP ${c.value}`, process_name: `程序 ${c.value} 的全部流量` }[c.type];
    hint.textContent = `将添加：${what} → ${targetName(ruleTarget)}。${targetDesc(ruleTarget)}`;
  };
  val.oninput = () => { ruleDraft = val.value; preview(); };
  type.onchange = preview;
  preview();
  const doAdd = async () => {
    if (!val.value.trim()) { val.focus(); return; }
    const c = current();
    add.disabled = true;
    try {
      await saveRule({ ...c, target: ruleTarget, note: note.value.trim() });
      toast(`已添加：${c.value} → ${targetName(ruleTarget)}，一两秒后生效`);
      ruleDraft = "";
      render();
    } catch (e) { add.disabled = false; hint.textContent = e.message; hint.classList.add("err"); }
  };
  add.onclick = doAdd;
  val.onkeydown = (e) => e.key === "Enter" && doAdd();
  return card;
}

function rulesSection() {
  const n = userRules ? userRules.rules.length : 0;
  const sec = $(`<section class="sec" aria-labelledby="mine-h"><div class="sec-head"><div><h2 id="mine-h">我的规则 <span class="muted" style="font-weight:500">${n ? n + " 条" : ""}</span></h2>
    <p>优先级最高，比上面所有设置都先看。同一个网站只能有一条，再加会改成新的。</p></div></div></section>`);
  if (userRules) {
    const filter = $(`<input type="search" placeholder="搜索" aria-label="搜索规则" style="width:160px">`);
    const exportBtn = $(`<button class="btn">导出</button>`);
    const importBtn = $(`<button class="btn">导入</button>`);
    const acts = $(`<div class="row"></div>`);
    if (n > 5) acts.append(filter);
    acts.append(exportBtn, importBtn);
    sec.querySelector(".sec-head").append(acts);
    exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify({ version: 1, rules: userRules.rules.map(({ orphan, ...r }) => r) }, null, 1)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "my-rules.json"; a.click();
    };
    importBtn.onclick = () => importRules();
    const list = $(`<div></div>`);
    sec.append(list);
    const drawList = () => {
      const f = filter.value.trim().toLowerCase();
      const rules = (userRules?.rules || []).map((r, i) => ({ ...r, i })).reverse()
        .filter((r) => !f || [r.value, r.note, targetName(r.target)].join(" ").toLowerCase().includes(f));
      list.innerHTML = "";
      if (!userRules?.rules.length) { list.append($(`<p class="hint" style="margin:0">还没有规则。上面粘贴一个网址试试。</p>`)); return; }
      const box = $(`<div class="list"></div>`);
      for (const r of rules) {
        const li = $(`<div class="li"><div class="main"><div class="mono" style="font-size:14px">${esc(r.value)}</div>
          <div class="d">${TYPE_NAMES[r.type] || r.type}${r.added ? " · " + esc(r.added.replace("T", " ").slice(0, 16)) : ""}${r.note ? " · " + esc(r.note) : ""}</div>
          ${r.orphan ? `<span class="badge b-bad">这个去向在当前配置里不存在，规则没有生效</span>` : ""}</div>
          <div class="row tg" style="flex:0 1 260px;flex-wrap:nowrap"><span class="muted" aria-hidden="true">→</span></div>
          <button class="btn small ghost del" aria-label="删除 ${esc(r.value)}">删除</button></div>`);
        const s = targetSelect(r.target);
        s.setAttribute("aria-label", `${r.value} 走哪里`);
        s.style.minWidth = "0";
        s.classList.add("grow");
        s.onchange = async () => {
          try { await saveRule({ type: r.type, value: r.value, target: s.value, note: r.note }); toast(`${r.value} → ${targetName(s.value)}`); drawList(); }
          catch (e) { toast("保存失败：" + e.message); }
        };
        li.querySelector(".tg").append(s);
        li.querySelector(".del").onclick = async () => {
          try { userRules = await helperApi("/rules/delete", { method: "POST", body: JSON.stringify({ type: r.type, value: r.value }) }); toast(`已删除 ${r.value}`); render(); }
          catch (e) { toast("删除失败：" + e.message); }

        box.append(li);
      }
      list.append(box, $(`<p class="hint" style="margin:8px 0 0">保存在 ${esc(userRules.dir)}（user-rules.json）。</p>`));
    };

    drawList();

  renderCustomRules(sec);
  return sec;
}

// ---------- 实时连接 ----------
const procName = (m) => (m.processPath || "").split(/[\\/]/).pop().replace(/ \([^)]*\)$/, "");
function ruleText(c) {
  const r = c.rule || "";
  if (r === "final") return "其余流量（兜底）";
  if (/user-/.test(r)) return "我的规则";
  if (/^inbound=/.test(r)) return "固定端口";
  if (/ip_is_private/.test(r)) return "局域网";
  if (/ip_cidr=::\/0/.test(r)) return "国内有 IPv6";
  if (/=> route\(国内仅 v4 网站\)/.test(r)) return /geoip/.test(r) ? "国内 IP（只有 v4）" : "国内网站（只有 v4）";
  const to = (r.match(/=> (?:route\()?([^)]*)\)?$/) || [])[1] || "";
  if (/^process_/.test(r)) return `按程序 → ${to}`;
  if (/^rule_set=/.test(r)) return `按网站类别 → ${to}`;
  if (/^domain/.test(r)) return `按域名 → ${to}`;
  if (/^ip_cidr/.test(r)) return `按 IP → ${to}`;
  return r;
}

function renderConn() {
  const m = main();
  m.append($(`<div><a class="back" href="#/settings">← 设置</a><h1>实时连接</h1><p class="lead">每 2 秒刷新（鼠标停在表格上时暂停）。「实际出口」是这条连接最后从哪出去的；走得不对就点「改规则」，以后同样的连接都按新规则走。</p></div>`));
  const bar = $(`<div class="row" style="margin-bottom:12px"></div>`);
  const filter = $(`<input type="search" placeholder="搜索：域名、程序、分组，如 微信" class="grow">`);
  const paidOnly = $(`<label class="row small" style="gap:4px"><input type="checkbox"> 只看计费的</label>`);
  const pause = $(`<button class="btn small">暂停</button>`);
  const stat = $(`<span class="badge b-muted"></span>`);
  bar.append(filter, paidOnly, pause, stat);
  m.append(bar);
  const table = $(`<table><thead><tr><th>目标</th><th>程序</th><th>为什么走这条</th><th>实际出口</th><th class="num">流量</th><th></th></tr></thead><tbody></tbody></table>`);
  m.append(table);
  // 鼠标停在表格上时不重画：否则每 2 秒换一遍行，点「改规则」会点空
  let data = [], paused = false, hovering = false;
  table.onmouseenter = () => { hovering = true; stat.textContent += " · 已暂停刷新"; };
  table.onmouseleave = () => { hovering = false; draw(); };
  const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : b > 1024 ? (b / 1024).toFixed(0) + " KB" : b + " B";
  const draw = () => {
    if (hovering || document.querySelector(".modal-bg")) return;
    const f = filter.value.trim().toLowerCase(), po = paidOnly.querySelector("input").checked;
    const rows = data.filter((c) => (!f || JSON.stringify([c.metadata.host, c.metadata.destinationIP, c.metadata.processPath, c.rule, c.chains]).toLowerCase().includes(f))
      && (!po || cost(c.chains[0])[0] === "b-paid"));
    stat.textContent = `${rows.length} / ${data.length} 条`;
    table.tBodies[0].innerHTML = "";
    for (const c of rows.slice(0, 300)) {
      const md = c.metadata, target = md.host || md.destinationIP;
      const via = c.chains.slice(1).reverse().join(" → ");
      const tr = $(`<tr><td><span class="mono">${esc(target)}</span><div class="small muted">${esc(md.network)} ${esc(md.destinationPort)}</div></td>
        <td class="small">${esc(procName(md))}</td><td class="small">${esc(ruleText(c))}</td>
        <td><div>${esc(c.chains[0])} ${costBadge(c.chains[0])}</div>${via ? `<div class="small muted">${esc(via)}</div>` : ""}</td>
        <td class="num small">↓${fmt(c.download)}<br>↑${fmt(c.upload)}</td><td><button class="btn small">改规则</button></td></tr>`);
      tr.querySelector("button").onclick = () => ruleFromConn(c, data);
      table.tBodies[0].append(tr);
    }
  };
  filter.oninput = draw;
  paidOnly.querySelector("input").onchange = draw;
  pause.onclick = () => { paused = !paused; pause.textContent = paused ? "继续" : "暂停"; };
  const tick = async () => {
    if (paused) return;
    try { data = ((await api("/connections")).connections || []).sort((a, b) => (b.start > a.start ? 1 : -1)); draw(); } catch { }
  };
  tick();
  timer = setInterval(tick, 2000);
}

// 从一条连接加规则：给出域名的几级后缀、IP、程序名让用户选
function ruleFromConn(c, all) {
  const md = c.metadata, host = (md.host || "").toLowerCase(), proc = procName(md);
  const choices = [];
  if (host && !/^[\d.:]+$/.test(host)) {
    const parts = host.split(".");
    for (let i = 0; i <= parts.length - 2; i++) {
      const d = parts.slice(i).join(".");
      choices.push({ type: "domain_suffix", value: d, label: i === 0 ? `${d}（及子域名）` : `${d} 及它的所有子域名` });
    }
  }
  const ip = md.destinationIP || (/^[\d.:]+$/.test(host) ? host : "");
  if (ip && !ip.startsWith("198.18.") && !ip.startsWith("fc00:")) choices.push({ type: "ip_cidr", value: ip, label: `IP ${ip}` });
  if (proc && meta.platform !== "ios") choices.push({ type: "process_name", value: proc, label: `程序 ${proc} 的全部流量` });
  // 这条连接现在命中的「我的规则」：保存新规则时一起删掉，否则它们可能抢先匹配，新规则对这个网站不起作用
  const overlaps = (userRules?.rules || []).filter((r) => (r.type === "domain_suffix" && host && (host === r.value || host.endsWith("." + r.value)))
    || (r.type === "domain" && host === r.value) || (r.type === "domain_keyword" && host.includes(r.value))
    || (r.type === "process_name" && proc === r.value) || (r.type === "ip_cidr" && ip && r.value.split("/")[0] === ip));
  const pick = choices.length > 2 && choices[0].type === "domain_suffix" ? Math.min(choices.filter((x) => x.type === "domain_suffix").length - 1, 1) : 0;
  const bg = $(`<div class="modal-bg"><div class="modal"><h3>改规则</h3>
    <p class="small muted">现在：${esc(ruleText(c))}，从「${esc(c.chains[0])}」出去。</p>
    <div class="field"><div class="lbl">匹配什么</div><div class="choices">${choices.map((x, i) =>
      `<label class="choice"><input type="radio" name="ch" value="${i}" ${i === pick ? "checked" : ""}><span>${esc(x.label)}</span></label>`).join("")}</div></div>
    <div class="field"><div class="lbl">改为走</div><div class="tsel"></div><div class="small muted tdesc" style="margin-top:4px"></div></div>
    ${overlaps.length ? `<div class="note warn small">它现在命中你已有的规则：${overlaps.map((r) => `${esc(r.value)} → ${esc(targetName(r.target))}`).join("、")}。
      保存时会把这些一起删掉，免得它们抢先匹配。</div>` : ""}
    <label class="choice small"><input type="checkbox" class="kill" checked><span>断开现有的相关连接，让它们马上按新规则重连</span></label>
    <div class="small err-msg" style="color:var(--bad)"></div>
    <div class="actions"><button class="btn cancel">取消</button><button class="btn primary ok">保存</button></div></div></div>`);
  if (!meta.user_targets?.length || !helper.rules) {
    bg.querySelector(".modal").innerHTML = `<h3>现在不能在面板里加规则</h3><p>${!meta.user_targets?.length ? "这份配置没有开「我的规则」。" : "连不上本地助手。"}${esc(helperHelp())}</p>
      <div class="actions"><button class="btn cancel">知道了</button></div>`;
  } else {
    const s = targetSelect(c.chains[0] === "直连 v4" ? "server" : "direct");
    s.style.width = "100%";
    bg.querySelector(".tsel").append(s);
    const d = () => (bg.querySelector(".tdesc").textContent = targetDesc(s.value));
    s.onchange = d; d();
    bg.querySelector(".ok").onclick = async () => {
      const ch = choices[+bg.querySelector("input[name=ch]:checked").value];
      try {
        for (const r of overlaps) {
          if (r.type === ch.type && r.value === ch.value) continue; // 同一条会被直接改成新去向
          userRules = await helperApi("/rules/delete", { method: "POST", body: JSON.stringify({ type: r.type, value: r.value }) });
        }
        await saveRule({ type: ch.type, value: ch.value, target: s.value, note: "从实时连接添加" });
      } catch (e) { bg.querySelector(".err-msg").textContent = e.message; return; }
      let killed = 0;
      if (bg.querySelector(".kill").checked) {
        // 等 sing-box 重新加载规则文件后再断开，重连时才会用上新规则
        await new Promise((r) => setTimeout(r, 1500));
        const hit = (x) => {
          const xm = x.metadata, h = (xm.host || "").toLowerCase();
          if (ch.type === "domain_suffix") return h === ch.value || h.endsWith("." + ch.value);
          if (ch.type === "ip_cidr") return xm.destinationIP === ch.value;
          return procName(xm) === ch.value;
        };
        for (const x of all.filter(hit)) { try { await api("/connections/" + x.id, { method: "DELETE" }); killed++; } catch { } }
      }
      bg.remove();
      toast(`已保存：${ch.value} → ${targetName(s.value)}${killed ? `，断开了 ${killed} 条连接` : ""}`);
    };
  }
  document.body.append(bg);
  bg.querySelector(".cancel").onclick = () => bg.remove();
  bg.onclick = (e) => e.target === bg && bg.remove();
}

// ---------- 流量统计 ----------
const gb = (b) => b >= 1073741824 ? (b / 1073741824).toFixed(b >= 10737418240 ? 1 : 2) + " G" : (b / 1048576).toFixed(b >= 104857600 ? 0 : 1) + " M";
const rateFmt = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";
const srvSum = (b) => Object.values(b.server || {}).reduce((x, y) => x + y, 0);

// ---------- 网站流量排名 ----------
function renderSites(kind) {
  const types = { v6: ["走 IPv6 省下", "--free"], server: ["经服务器省下", "--accent"], v4: ["计费流量", "--paid"] };
  const m = main(), type = types[kind];
  if (!type) { m.append(head("网站流量排名", "请从概览中的流量卡片进入。", ["home", "概览"])); return; }
  m.append(head(type[0] + " · 网站排名", "按主域名合并，上下行合计；没有域名的连接显示目标 IP。占比以该类当月总流量计算。", ["home", "概览"]));
  const controls = $(`<div class="row"><label for="site-month">月份</label><select id="site-month" aria-label="月份"></select><span class="hint">保留最近 3 个月的网站明细</span></div>`);
  const box = $(`<div class="sec" style="--site-color:var(${type[1]})"><div class="hint">读取中……</div></div>`);
  m.append(controls, box);
  const select = controls.querySelector("select"), now = new Date();
  const current = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  let month = current, loading = false;
  select.append(new Option(current, current));
  const pct = (n, total) => total > 0 ? Math.min(100, n / total * 100) : 0;
  const tick = async () => {
    if (loading) return;
    loading = true;
    const requested = month;
    try {
      const d = await helperApi(`/traffic/sites?kind=${kind}&month=${encodeURIComponent(requested)}`);
      if (!box.isConnected || month !== requested) return;
      const months = [...new Set([current, requested, ...d.months])].sort().reverse();
      select.replaceChildren(...months.map((key) => new Option(key, key, false, key === month)));
      const sum = d.items.reduce((n, item) => n + item.bytes, 0), rest = Math.max(0, d.total - sum);
      const row = (rank, site, n) => `<div class="site-row"><span class="muted small">${rank}</span><div><div class="site-name">${esc(site)}</div>
        <div class="site-track"><i style="width:${pct(n, d.total)}%"></i></div></div><div class="site-size">${gb(n)}B<small>${pct(n, d.total).toFixed(1)}%</small></div></div>`;
      box.innerHTML = `<div class="card stat"><div class="k">${esc(month)} · ${type[0]}</div><div class="v" style="color:var(${type[1]})">${bigSize(d.total)}</div><div class="s">网站排名前 100 名</div></div>
        ${d.items.length || rest > 0 ? `<div class="list">${d.items.map((item, i) => row(i + 1, item.site, item.bytes)).join("")}
          ${rest > 0 ? row("—", "其他 / 未按网站记录的流量", rest) : ""}</div>` : `<div class="card muted">这个月还没有这类网站流量。</div>`}
        <p class="hint">从 ${esc(String(d.since).replace("T", " "))} 起按网站记录。升级前的流量、未进入前 100 名的网站，以及采样之间已关闭、无法归属的连接，合并在「其他 / 未按网站记录的流量」中。
        明细只保存在这台电脑上，查看需要面板密钥。</p>`;
    } catch (e) {
      if (!box.isConnected || month !== requested) return;
      box.innerHTML = e.message === "not found" || e.message === "HTTP 404"
        ? `<div class="note warn">本地助手还不支持网站排名，请在<a href="#/settings">设置</a>中更新客户端。</div>`
        : `<div class="note err">读取网站排名失败：${esc(e.message)}。${esc(helperHelp())}</div>`;
    } finally { loading = false; }
  };
  select.onchange = () => { month = select.value; box.innerHTML = `<div class="hint">读取中……</div>`; tick(); };
  tick();
  timer = setInterval(tick, 2000);
}

      <div class="cards">

        ${card("d-ok", "合计省下", gb(x.v6 + srv), `今天 ${gb((day ? day.v6 : 0) + srvDay)}`)}
        ${card("d-mid", "校园网 v4 · 计费", gb(x.v4), `今天 ${gb(day ? day.v4 : 0)} · 现在 ${rateFmt(r.v4)}`)}

// 订阅、手动节点、设置存在本地助手的 profile.json；改完在面板里用 lib/build.js 生成配置，交给助手的 /apply 检查、安装（不通自动换回）
const LIB_FILES = ["js-yaml.mjs", "groups.js", "convert.js", "subscription.js", "build.js"];
// 和这次安装绑定的设置：总以助手报的为准，面板里改不了
const FORCED = ["clash_api", "clash_api_secret", "panel_dir", "rules_dir", "windows_panel_dir", "windows_rules_dir", "traffic_port"];
let neuLib = null, client = null, logWs = null, clashMode = null;

async function lib() {
  if (neuLib) return neuLib;
  // sing-box 发文件不带 Cache-Control：先把缓存里可能是旧版的生成器换掉再加载
  await Promise.all(LIB_FILES.map((f) => fetch("lib/" + f, { cache: "reload" }).catch(() => { })));
  const [b, s, c] = await Promise.all([import("./lib/build.js"), import("./lib/subscription.js"), import("./lib/convert.js")]);
  return (neuLib = { ...b, ...s, ...c });
}

async function loadClient() {
  client = null;
  if (!helper.client) return;
  try { client = await helperApi("/profile"); } catch (e) { helper.error = e.message; }
}
const prof = () => client?.profile;
async function saveProfile() { await helperApi("/profile", { method: "PUT", body: JSON.stringify(client.profile) }); }
async function changed(msg) {
  prof().pending = true;
  try { await saveProfile(); } catch (e) { toast("保存失败：" + e.message); return; }
  if (msg) toast(msg);
  render();
}
const rid = () => Math.random().toString(36).slice(2, 10);
const hostOf = (u) => { try { return new URL(u).hostname; } catch { return "订阅"; } };
const when = (iso) => {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "—";
  const z = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
};

function dispositionName(d) {
  const m = d && (d.match(/filename\*=UTF-8''([^;]+)/i) || d.match(/filename="?([^";]+)"?/i));
  try { return m ? decodeURIComponent(m[1]).replace(/\.(ya?ml|txt|json|conf)$/i, "").trim() : ""; } catch { return ""; }
}

/** 下载并解析一个订阅，写回 s；返回节点有没有变 */
async function fetchSub(s) {
  const L = await lib();
  const r = await helperApi("/fetch", { method: "POST", body: JSON.stringify({ url: s.url }) });
  const parsed = L.parseSubscription(r.text);
  if (!parsed.proxies.length) throw new Error(parsed.errors[0] || "订阅里没有节点");
  const before = JSON.stringify(s.proxies || []);
  Object.assign(s, { proxies: parsed.proxies, format: parsed.format, updated: new Date().toISOString(), error: null,
    userinfo: L.parseUserinfo(r.userinfo), skipped: parsed.proxies.filter((p) => !L.convert(p)).length });
  if (!s.name) s.name = dispositionName(r.disposition) || hostOf(s.url);
  return before !== JSON.stringify(s.proxies);
}

/** 按面板里的设置生成配置，交给本地助手安装 */
async function applyClient() {
  const L = await lib();
  const p = prof(), d = client.defaults;
  const pick = (o, ks) => Object.fromEntries(ks.filter((k) => o[k] !== undefined).map((k) => [k, o[k]]));
  const settings = { ...pick(d, ["listen", "main_port"]), ...p.settings, ...pick(d, FORCED) };
  const { config, panel, warnings } = L.build(settings, L.collectProxies(p), d.platform);
  const base = settings.rule_set_base || L.DEFAULTS.rule_set_base;
  const rule_sets = Object.fromEntries(L.ruleSetRefs(d.platform, settings).map((r) => [L.rsTag(r), L.ruleSetUrl(base, r)]));
  const r = await helperApi("/apply", { method: "POST", body: JSON.stringify({ config: JSON.stringify(config), panel: JSON.stringify(panel), rule_sets }) });
  p.pending = false;
  await saveProfile();
  return { ...r, warnings };
}

  const bar = $(`<div class="note bar"><span><b>改动还没生效。</b><span class="muted">点「应用」重新生成配置，网络会断开几秒；新配置上不了网会自动换回原来的。</span></span>

      if (r.warnings.length) alert("生成时的提示：\n" + r.warnings.join("\n"));

      const sel = groupSelect(grp.group, "grow");

    }

  }
  m.append(sec);

  // 手动添加的节点
  if (p.nodes.length) {
    const own = $(`<section class="sec" aria-labelledby="own-h"><h2 id="own-h">手动添加的节点 <span class="muted" style="font-weight:500">${p.nodes.length}</span></h2><div class="list"></div></section>`);
    const servers = p.settings.entry_servers || {};

        <div class="d">${esc(n.type === "_singbox" ? n.outbound?.type : n.type)} · <span class="mono">${esc(n.server)}:${esc(n.port)}</span>${servers[n.server] ? " · 也是免流服务器（在「设置」里管理）" : ""}</div></div>

      own.querySelector(".list").append(li);
    }
    m.append(own);
  }
}

/** 运行方式：模式一（只省 IPv6，不用服务器）/ 模式二（自带服务器）。总是显示，命令行生成的配置也能看到现在是哪种 */
function modeSection(m) {
  const p = prof(), s = p?.settings;
  const servers = s?.entry_servers || {}, ids = Object.keys(servers);
  const running = meta.mode === "tunnel";        // 现在运行的配置
  const chosen = p ? ids.length > 0 : running;   // 面板里的设置（点「应用」后生效）
  const editable = !!(helper.client && p);
  const two = chosen || (editable && wantServer);
  const sec = $(`<section class="sec" aria-labelledby="mode-h"><div class="sec-head"><div><h2 id="mode-h">运行方式</h2>
    <p>没有自己的服务器，用模式一就够了；有一台带 IPv6 的 VPS，再换模式二。</p></div></div><div class="pick" role="radiogroup" aria-label="运行方式"></div></section>`);
  const pick = sec.querySelector(".pick");
  const opt = (on, t, d, fn) => {
    const b = $(`<button type="button" role="radio" aria-checked="${on}" class="chip ${on ? "on" : ""}"><b>${t}</b><span>${d}</span></button>`);
    b.onclick = fn;
    b.disabled = !editable;
    pick.append(b);
  };
  opt(!two, "模式一 · 只省 IPv6", "不用服务器，装好就能用。有 IPv6 的网站免费，只有 IPv4 的照常计费；加了机场订阅也能上国外网站。", () => {
    if (ids.length) {
      if (!confirm("删掉全部免流服务器、换回模式一？服务器的节点还留在「订阅与节点」里。")) return;
      s.entry_servers = {};
      wantServer = false;
      changed("已换回模式一，点「应用」后生效");
    } else { wantServer = false; render(); }
  });
  opt(two, "模式二 · 自带服务器", "只有 IPv4 的网站也经你的服务器出去，不计费。需要一台有 IPv6 的 VPS，先在上面运行一次部署脚本。", () => {
    if (!ids.length && !wantServer) { wantServer = true; render(); }
  });
  if (!helper.client) sec.append($(`<p class="hint" style="margin:0">现在是${running ? "模式二" : "模式一"}。连不上本地助手，不能在这里切换。</p>`));
  else if (!p) sec.append($(`<p class="hint" style="margin:0">现在是${running ? "模式二" : "模式一"}。这份配置是用命令行生成的（或者刚装好）：要在这里切换，先点下面的「开始」。</p>`));
  else if (chosen !== running) sec.append($(`<p class="hint" style="margin:0">现在运行的是${running ? "模式二" : "模式一"}，点页面上方的「应用」后换成${chosen ? "模式二" : "模式一"}。</p>`));
  if (editable && two) sec.append(serverBox(p, s, servers, ids));
  m.append(sec);
}

/** 模式二的服务器：已有的列表；加服务器（粘贴部署脚本的输出，或从已有节点里选） */
function serverBox(p, s, servers, ids) {
  const box = $(`<div class="list"></div>`);
  for (const id of ids) {
    const v = servers[id];
    const li = $(`<div class="li"><div class="main"><div class="t">${esc(v.label)}</div><div class="d mono">${esc(id)} · ${esc(v.v6)}</div></div>
      <label class="check"><input type="checkbox" style="flex:none" ${v.landing ? "checked" : ""}>也当国外线路用</label><button class="btn small ghost">删除</button></div>`);
    li.querySelector("input").onchange = (e) => { v.landing = e.target.checked; changed(); };
    li.querySelector("button").onclick = () => {
      if (ids.length === 1 && !confirm("删掉最后一台服务器就换回模式一。确定？")) return;
      delete servers[id]; s.entry_servers = servers; changed();
    };
    box.append(li);
  }
  // 粘贴 server/setup.sh 最后输出的那一段：节点和服务器的 IPv6 都在里面
  const paste = $(`<div class="li" style="flex-direction:column;align-items:stretch;gap:10px">
    <div class="t">${ids.length ? "再加一台服务器" : "加服务器"}</div>
    <div class="hint">在服务器上运行一次 <span class="mono">bash setup.sh</span>（见文档 docs/server.md），把最后输出的那一整段粘到这里：</div>
    <textarea class="mono" rows="5" aria-label="部署脚本的输出" placeholder="entry_servers: …"></textarea>
    <div class="row"><button class="btn primary">添加</button><span class="hint grow"></span></div></div>`);
  const hint = paste.querySelector(".row .hint");
  paste.querySelector("button").onclick = async () => {
    const r = (await lib()).parseSubscription(paste.querySelector("textarea").value);
    const srv = r.settings?.entry_servers;
    if (!srv) { hint.textContent = r.proxies.length ? "认出了节点，但没有服务器的 IPv6 地址：请粘贴 setup.sh 最后输出的那一整段" : (r.errors[0] || "没有认出内容"); hint.classList.add("err"); return; }
    const names = new Set(p.nodes.map((x) => x.name));
    p.nodes.push(...r.proxies.filter((x) => !names.has(x.name)));
    s.entry_servers = { ...servers, ...srv };
    if (r.settings.entry_default) s.entry_default = r.settings.entry_default;
    wantServer = false;
    changed(`已加「${Object.values(srv).map((x) => x.label).join("、")}」，点「应用」后换成模式二`);
  };
  box.append(paste);
  // 节点已经在「订阅与节点」里（订阅或手动添加都行）：选中它，填上服务器的 IPv6 地址
  const cand = new Map();
  if (!neuLib) lib().then(() => route().page === "settings" && render()).catch(() => { });
  // 和生成配置时一样取节点（停用的订阅、被排除的「剩余流量」之类不算）
  const all = neuLib ? neuLib.collectProxies(p) : [...p.subscriptions.flatMap((y) => y.proxies || []), ...p.nodes];
  for (const x of all) {
    if (x.server && /^[\d.]+$/.test(x.server) && !servers[x.server] && !cand.has(x.server)) cand.set(x.server, x.name);
  }
  const manual = $(`<details class="li" style="display:block"><summary class="small">其他办法：服务器的节点已经在「订阅与节点」里了，手动指定</summary>
    <div class="row" style="margin-top:10px"><select class="srv grow" aria-label="服务器的节点">${[...cand].map(([ip, n]) => `<option value="${esc(ip)}">${esc(ip)}（${esc(n)}）</option>`).join("")}
      <option value="">手动填节点地址……</option></select>
      <input type="text" class="ip mono" placeholder="节点的 IPv4 地址" aria-label="节点的 IPv4 地址" style="width:160px;display:${cand.size ? "none" : ""}">
      <input type="text" class="v6 mono" placeholder="服务器的 IPv6 地址" aria-label="服务器的 IPv6 地址" style="width:220px">
      <input type="text" class="lb" placeholder="名字，如 港机" aria-label="服务器名字" style="width:130px"><button class="btn">加为免流服务器</button></div>
    <div class="hint" style="margin-top:8px">只认 Hysteria2、TUIC、VLESS Reality、AnyTLS 这几种节点；服务器的入站要监听 ::（IPv6）。</div></details>`);
  const sel = manual.querySelector(".srv"), ipIn = manual.querySelector(".ip");
  sel.onchange = () => { ipIn.style.display = sel.value ? "none" : ""; };
  manual.querySelector("button").onclick = () => {
    const ip = sel.value || ipIn.value.trim(), v6 = manual.querySelector(".v6").value.trim(), label = manual.querySelector(".lb").value.trim();
    if (!/^[\d.]+$/.test(ip)) return toast("节点地址要填 IPv4");
    if (!v6.includes(":")) return toast("请填服务器的 IPv6 地址");
    if (!label) return toast("请起个名字");
    s.entry_servers = { ...servers, [ip]: { v6, label } };
    wantServer = false;
    changed(`已加「${label}」，点「应用」后换成模式二`);
  };
  box.append(manual);
  return box;
}

/** 本机代理端口；模式二时订阅的节点要不要先经服务器 */
function proxySection(m) {
  const s = prof().settings;
  const ids = Object.keys(s.entry_servers || {});
  const other = $(`<section class="sec" aria-labelledby="proxy-h"><h2 id="proxy-h">本机代理</h2><div class="list">
    <div class="li"><label class="main" for="port"><div class="t">代理端口</div>
      <div class="d">大部分程序不用设。命令行工具、浏览器插件要代理时填 127.0.0.1 和这个端口（HTTP、SOCKS5 都行）。</div></label>

      <span style="flex:1">订阅里的节点先经免流服务器再出去（免费）。关掉 = 校园网 IPv4 直接连节点（计费，延迟低）</span></label></div></div></section>`);

/** 版本与更新。本地助手查 GitHub 上的最新发布，点「更新」由它下载、校验、安装（不要管理员） */
function renderUpdate(m) {
  const sec = $(`<section class="sec" aria-labelledby="ver-h"><h2 id="ver-h">版本与更新</h2>
    <div class="card sec"><div class="row"><div class="grow" style="min-width:220px"><div style="font-weight:600">当前版本 <span class="cur">${esc(helper.version || "—")}</span></div>
      <div class="hint body">读取中……</div></div><button class="btn chk">检查更新</button></div></div></section>`);
  const card = sec.querySelector(".card"), body = sec.querySelector(".body");
  const show = (v) => {
    card.querySelector(".cur").textContent = v.current === "0" ? "1.0.0 或更早" : v.current;
    card.querySelector(".upd")?.remove();
    body.classList.remove("err");

    else body.textContent = `${when(v.checked)} 检查到新版本。`;

    // 更新说明不在这里显示（Markdown 显示不好）：给个链接去 GitHub 看
    const box = $(`<div class="upd row" style="border-top:1px solid var(--line);padding-top:14px"><div class="grow" style="min-width:240px">
      <b>有新版本 ${esc(v.latest)}</b> · <a href="${esc(v.url)}" target="_blank" rel="noopener">在 GitHub 上看更新了什么</a>
      <div class="hint">不需要管理员密码；配置、订阅、设置和我的规则都保留，装完点一次页面上方的「应用」。</div></div>
      <button class="btn primary big">更新到 ${esc(v.latest)}</button></div>`);
    const b = box.querySelector("button");
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = "下载并安装中……";
      try {
        const r = await helperApi("/update/install", { method: "POST" });
        b.textContent = "已安装，等本地助手重启……";
        for (let i = 0; i < 40; i++) {
          await new Promise((ok) => setTimeout(ok, 1000));
          try { if ((await helperApi("/health")).version === r.to) break; } catch { /* 正在重启 */ }
        }
        if (prof()) { prof().pending = true; await saveProfile().catch(() => { }); }
        location.reload();
      } catch (e) {
        b.disabled = false;
        b.textContent = `更新到 ${v.latest}`;
        box.append($(`<div class="hint err">更新失败：${esc(e.message)}（原来的版本没动）</div>`));
      }
    };
    card.append(box);
  };
  sec.querySelector(".chk").onclick = async (e) => {
    e.target.disabled = true;
    body.textContent = "检查中……";
    try { show(await helperApi("/update/check", { method: "POST" })); } catch (err) { body.textContent = "检查失败：" + err.message; }
    e.target.disabled = false;
  };
  if (!helper.client) body.textContent = "本地助手是旧版，不支持自动更新。" + helperHelp();
  else helperApi("/update").then(show).catch((e) => { body.textContent = "读取失败：" + e.message; });
  m.append(sec);
}

function renderLogs() {
  const m = main();
  m.append($(`<div><a class="back" href="#/settings">← 设置</a><h1>日志</h1><p class="lead">sing-box 实时输出的日志（警告和错误）。连不上某个节点、规则集加载失败、DNS 出错都会在这里出现。</p></div>`));
  const bar = $(`<div class="row" style="margin-bottom:10px"><input type="search" class="grow" placeholder="筛选"><label class="small"><input type="checkbox"> 暂停</label>
    <button class="btn small">清空</button></div>`);
  const box = $(`<div class="card mono" style="height:62vh;overflow:auto;white-space:pre-wrap;line-height:1.5"></div>`);
  m.append(bar, box);
  const lines = [];
  const [filter, paused, clear] = [bar.querySelector("input[type=search]"), bar.querySelector("input[type=checkbox]"), bar.querySelector("button")];
  const draw = () => {
    const f = filter.value.trim().toLowerCase();
    const shown = lines.filter((l) => !f || l.toLowerCase().includes(f));
    box.textContent = shown.length ? shown.join("\n") : "等待日志……（没有警告和错误就是一切正常）";
    box.scrollTop = box.scrollHeight;
  };
  filter.oninput = draw;
  clear.onclick = () => { lines.length = 0; draw(); };
  draw();
  logWs = new WebSocket(`${API.replace(/^http/, "ws")}/logs?level=warning&token=${encodeURIComponent(secret)}`);
  logWs.onmessage = (e) => {
    try { const d = JSON.parse(e.data); lines.push(`${new Date().toTimeString().slice(0, 8)} [${d.type}] ${d.payload}`); } catch { return; }
    if (lines.length > 600) lines.splice(0, lines.length - 600);
    if (!paused.checked) draw();
  };
}

/** 概览上的「智能分流 / 全部走代理 / 全部直连」：Clash API 的 mode */
function modeSwitch() {
  const modes = [["Rule", "智能分流", "按线路与规则分流（平时用这个）"], ["Global", "全部走代理", "所有网站都走「国外网站」的选择，国内网站也绕出去"],
    ["Direct", "全部直连", "全部校园网直连：有 IPv6 走 IPv6，没有的走 IPv4（计费）"]];
  const cur = (clashMode || "Rule").toLowerCase();
  const seg = $(`<div class="seg" role="group" aria-label="代理方式"></div>`);
  for (const [v, t, d] of modes) {
    const on = cur === v.toLowerCase();
    const b = $(`<button type="button" class="${on ? "on" : ""}" aria-pressed="${on}" title="${d}">${t}</button>`);
    b.onclick = async () => {
      if (on) return;
      try { await api("/configs", { method: "PATCH", body: JSON.stringify({ mode: v }) }); clashMode = v; toast(`已切到「${t}」`); render(); }
      catch (e) { if (e.message !== "401") toast("切换失败：" + e.message); }
    };
    seg.append(b);
  }
  return seg;
}

async function start() {
  if (!secret) return renderLogin();
  try {
    meta = await (await fetch("groups.json", { cache: "no-store" })).json();
    await load();
    version = (await api("/version").catch(() => ({}))).version || "";
    clashMode = (await api("/configs").catch(() => ({}))).mode || null;
  } catch (e) { if (e.message !== "401") renderLogin("连接失败：" + e.message); return; }
  await checkHelper();
  await Promise.all([loadRules(), loadClient()]);
  if (helper.client && helper.update && !helper.update.latest) {
    // 助手刚启动、还没查过新版本：现在查一次，有新版本就在菜单和概览上提示
    helperApi("/update").then((v) => { helper.update = { latest: v.latest, available: v.available }; if (v.available) render(); }).catch(() => { });
  }
  document.getElementById("root").innerHTML = `<div class="app"><nav aria-label="主菜单"></nav><main><div class="wrap"></div></main></div>`;
  // 第一次打开（还没加过订阅、节点和服务器）：先看新手引导
  if (shouldWelcome() && route().page === "home") history.replaceState(null, "", location.pathname + location.search + "#/welcome");
  window.onhashchange = render;
  render();
}

// sing-box 发面板时不带 Cache-Control，浏览器会一直用缓存里的旧面板。更新后发现服务器上的比缓存里的新，就换上新的再刷新一次
async function refreshIfStale() {
  try {
    const [cached, fresh] = await Promise.all([
      fetch(location.pathname, { cache: "force-cache" }).then((r) => r.text()),
      fetch(location.pathname, { cache: "no-store" }).then((r) => r.text()),
    ]);
    if (cached === fresh) return;
    let tried = "";
    try { tried = sessionStorage.getItem("neu-panel-refresh") || ""; } catch { }
    if (tried === String(fresh.length)) return;  // 刷新过一次还是旧的：不再循环
    try { sessionStorage.setItem("neu-panel-refresh", String(fresh.length)); } catch { }
    await fetch(location.pathname, { cache: "reload" });  // 用新面板替换缓存
    location.reload();
  } catch { }
}
refreshIfStale();
start();
</script>
